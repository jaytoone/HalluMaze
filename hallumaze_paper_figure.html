<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HalluMaze: LLM Metacognition Benchmark</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --text: #e8eaf0;
    --text-dim: #8892a4;
    --llm-a: #6eb3f7;
    --llm-b: #f77b6e;
    --base-a: #7bf7b5;
    --base-b: #f7dc7b;
    --ci: rgba(255,255,255,0.15);
    --font: 'SF Mono', 'Fira Code', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 32px;
  }

  .header {
    text-align: center;
    margin-bottom: 40px;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }
  .header .subtitle {
    color: var(--text-dim);
    font-size: 14px;
  }
  .header .badge {
    display: inline-block;
    background: rgba(110,179,247,0.15);
    border: 1px solid rgba(110,179,247,0.3);
    color: var(--llm-a);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 100px;
    margin: 8px 4px 0;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  .card.full { grid-column: 1 / -1; }
  .card h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-dim);
    margin-bottom: 20px;
  }

  /* SVG charts */
  svg text { font-family: inherit; }

  /* Table */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--text-dim);
    font-weight: 500;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-family: var(--font);
    font-size: 12px;
  }
  tr:last-child td { border-bottom: none; }
  .sig { color: #f7dc7b; font-size: 11px; }
  .model-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }
  .tag-llm { background: rgba(110,179,247,0.15); color: var(--llm-a); }
  .tag-base { background: rgba(123,247,181,0.12); color: var(--base-a); }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 4px;
  }
  .stat-box {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }
  .stat-box .val {
    font-size: 22px;
    font-weight: 700;
    font-family: var(--font);
    line-height: 1.2;
  }
  .stat-box .label {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .finding {
    background: rgba(247,220,123,0.08);
    border: 1px solid rgba(247,220,123,0.2);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.7;
    margin-top: 16px;
  }
  .finding strong { color: var(--text); }
</style>
</head>
<body>
<div class="header">
  <h1>HalluMaze Benchmark</h1>
  <p class="subtitle">LLM Metacognitive Navigation — Controlled Maze Hallucination Study</p>
  <span class="badge">n=30 seeds × 2 sizes</span>
  <span class="badge">Bootstrap 95% CI</span>
  <span class="badge">Bonferroni correction</span>
</div>
<div class="grid" id="main-grid"></div>

<script>
const DATA = {"MiniMax-M2.5": {"label": "MiniMax-M2.5", "n": 8, "metrics": {"sr": {"mean": 0.875, "ci_lo": 0.625, "ci_hi": 1.0, "n": 8}, "mei": {"mean": 0.865, "ci_lo": 0.795, "ci_hi": 0.9, "n": 8}, "hrr": {"mean": 1.0, "ci_lo": 1.0, "ci_hi": 1.0, "n": 8}, "brs": {"mean": 0.9955, "ci_lo": 0.9866, "ci_hi": 1.0, "n": 8}, "hallumaze_score": {"mean": 0.6389, "ci_lo": 0.6097, "ci_hi": 0.6607, "n": 8}, "sr_size5": {"mean": 0.875, "ci_lo": 0.625, "ci_hi": 1.0, "n": 8}, "mei_size5": {"mean": 0.865, "ci_lo": 0.795, "ci_hi": 0.9, "n": 8}, "hallumaze_score_size5": {"mean": 0.6389, "ci_lo": 0.6097, "ci_hi": 0.6607, "n": 8}}, "category": "LLM"}, "glm-4.7": {"label": "GLM-4.7", "n": 60, "metrics": {"sr": {"mean": 0.0833, "ci_lo": 0.0167, "ci_hi": 0.1667, "n": 60}, "mei": {"mean": 0.6145, "ci_lo": 0.5473, "ci_hi": 0.6785, "n": 60}, "hrr": {"mean": 0.7181, "ci_lo": 0.5958, "ci_hi": 0.825, "n": 60}, "brs": {"mean": 0.7051, "ci_lo": 0.6337, "ci_hi": 0.7701, "n": 60}, "hallumaze_score": {"mean": 0.5126, "ci_lo": 0.4751, "ci_hi": 0.5471, "n": 60}, "sr_size5": {"mean": 0.1667, "ci_lo": 0.0333, "ci_hi": 0.3, "n": 30}, "mei_size5": {"mean": 0.6462, "ci_lo": 0.5525, "ci_hi": 0.7362, "n": 30}, "hallumaze_score_size5": {"mean": 0.5186, "ci_lo": 0.465, "ci_hi": 0.5699, "n": 30}, "sr_size7": {"mean": 0.0, "ci_lo": 0.0, "ci_hi": 0.0, "n": 30}, "mei_size7": {"mean": 0.5828, "ci_lo": 0.4886, "ci_hi": 0.6771, "n": 30}, "hallumaze_score_size7": {"mean": 0.5066, "ci_lo": 0.4511, "ci_hi": 0.5582, "n": 30}}, "category": "LLM"}, "random_walk": {"label": "Random Walk", "n": 60, "metrics": {"sr": {"mean": 1.0, "ci_lo": 1.0, "ci_hi": 1.0, "n": 60}, "mei": {"mean": 0.9, "ci_lo": 0.9, "ci_hi": 0.9, "n": 60}, "hrr": {"mean": 1.0, "ci_lo": 1.0, "ci_hi": 1.0, "n": 60}, "brs": {"mean": 1.0, "ci_lo": 1.0, "ci_hi": 1.0, "n": 60}, "hallumaze_score": {"mean": 0.8, "ci_lo": 0.8, "ci_hi": 0.8, "n": 60}, "sr_size5": {"mean": 1.0, "ci_lo": 1.0, "ci_hi": 1.0, "n": 30}, "mei_size5": {"mean": 0.9, "ci_lo": 0.9, "ci_hi": 0.9, "n": 30}, "hallumaze_score_size5": {"mean": 0.8, "ci_lo": 0.8, "ci_hi": 0.8, "n": 30}, "sr_size7": {"mean": 1.0, "ci_lo": 1.0, "ci_hi": 1.0, "n": 30}, "mei_size7": {"mean": 0.9, "ci_lo": 0.9, "ci_hi": 0.9, "n": 30}, "hallumaze_score_size7": {"mean": 0.8, "ci_lo": 0.8, "ci_hi": 0.8, "n": 30}}, "category": "Baseline"}, "astar": {"label": "A* (Oracle)", "n": 60, "metrics": {"sr": {"mean": 1.0, "ci_lo": 1.0, "ci_hi": 1.0, "n": 60}, "mei": {"mean": 0.9, "ci_lo": 0.9, "ci_hi": 0.9, "n": 60}, "hrr": {"mean": 1.0, "ci_lo": 1.0, "ci_hi": 1.0, "n": 60}, "brs": {"mean": 1.0, "ci_lo": 1.0, "ci_hi": 1.0, "n": 60}, "hallumaze_score": {"mean": 0.8, "ci_lo": 0.8, "ci_hi": 0.8, "n": 60}, "sr_size5": {"mean": 1.0, "ci_lo": 1.0, "ci_hi": 1.0, "n": 30}, "mei_size5": {"mean": 0.9, "ci_lo": 0.9, "ci_hi": 0.9, "n": 30}, "hallumaze_score_size5": {"mean": 0.8, "ci_lo": 0.8, "ci_hi": 0.8, "n": 30}, "sr_size7": {"mean": 1.0, "ci_lo": 1.0, "ci_hi": 1.0, "n": 30}, "mei_size7": {"mean": 0.9, "ci_lo": 0.9, "ci_hi": 0.9, "n": 30}, "hallumaze_score_size7": {"mean": 0.8, "ci_lo": 0.8, "ci_hi": 0.8, "n": 30}}, "category": "Baseline"}};

const COLORS = {
  'MiniMax-M2.5': '#6eb3f7',
  'glm-4.7':      '#f77b6e',
  'random_walk':  '#7bf7b5',
  'astar':        '#f7dc7b',
  'bfs':          '#c4b5fd',
};
const LABELS = {
  'MiniMax-M2.5': 'MiniMax-M2.5 (LLM)',
  'glm-4.7':      'GLM-4.7 (LLM)',
  'random_walk':  'Random Walk (Baseline)',
  'astar':        'A* Oracle (Baseline)',
};
const MODEL_ORDER = ['MiniMax-M2.5', 'glm-4.7', 'random_walk', 'astar'];

const grid = document.getElementById('main-grid');

/* ── Helper: create SVG ── */
function makeSVG(w, h) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.setAttribute('width', '100%');
  return svg;
}

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function svgText(content, attrs) {
  const el = svgEl('text', attrs);
  el.textContent = content;
  return el;
}

/* ── Card builder ── */
function makeCard(title, full = false) {
  const card = document.createElement('div');
  card.className = 'card' + (full ? ' full' : '');
  const h2 = document.createElement('h2');
  h2.textContent = title;
  card.appendChild(h2);
  return card;
}

/* ── 1. Grouped Bar Chart: SR + Score by Model ── */
function buildBarChart() {
  const card = makeCard('Success Rate & HalluMaze Score (95% CI)', false);
  const W = 460, H = 280;
  const svg = makeSVG(W, H);
  const margin = { top: 16, right: 16, bottom: 48, left: 44 };
  const iw = W - margin.left - margin.right;
  const ih = H - margin.top - margin.bottom;

  // Background grid
  for (let v = 0; v <= 1.0; v += 0.25) {
    const y = margin.top + ih - v * ih;
    svg.appendChild(svgEl('line', { x1: margin.left, x2: W - margin.right, y1: y, y2: y,
      stroke: v === 0 ? '#3a3d4a' : 'rgba(255,255,255,0.06)', 'stroke-width': v === 0 ? 1 : 1 }));
    if (v > 0) svg.appendChild(svgText(v.toFixed(2), { x: margin.left - 6, y: y + 4,
      'text-anchor': 'end', fill: '#6b7280', 'font-size': 10 }));
  }

  const models = MODEL_ORDER.filter(m => DATA[m]);
  const barW = iw / (models.length * 2.5 + 1);
  const groupW = barW * 2.5;

  models.forEach((m, i) => {
    const d = DATA[m];
    const cx = margin.left + (i + 0.5) * groupW + barW;
    const col = COLORS[m];

    // SR bar
    const sr = d.metrics.sr;
    const srH = sr.mean * ih;
    const srY = margin.top + ih - srH;
    svg.appendChild(svgEl('rect', { x: cx - barW, y: srY, width: barW * 0.85, height: srH,
      fill: col, opacity: 0.9, rx: 2 }));
    // SR CI
    const srCiTop = margin.top + ih - sr.ci_hi * ih;
    const srCiBtm = margin.top + ih - sr.ci_lo * ih;
    svg.appendChild(svgEl('line', { x1: cx - barW * 0.575, x2: cx - barW * 0.575,
      y1: srCiTop, y2: srCiBtm, stroke: 'rgba(255,255,255,0.7)', 'stroke-width': 1.5 }));
    svg.appendChild(svgEl('line', { x1: cx - barW * 0.575 - 4, x2: cx - barW * 0.575 + 4,
      y1: srCiTop, y2: srCiTop, stroke: 'rgba(255,255,255,0.7)', 'stroke-width': 1.5 }));
    svg.appendChild(svgEl('line', { x1: cx - barW * 0.575 - 4, x2: cx - barW * 0.575 + 4,
      y1: srCiBtm, y2: srCiBtm, stroke: 'rgba(255,255,255,0.7)', 'stroke-width': 1.5 }));

    // Score bar
    const sc = d.metrics.hallumaze_score;
    const scH = sc.mean * ih;
    const scY = margin.top + ih - scH;
    svg.appendChild(svgEl('rect', { x: cx, y: scY, width: barW * 0.85, height: scH,
      fill: col, opacity: 0.4, rx: 2, stroke: col, 'stroke-width': 1 }));
    // Score CI
    const scCiTop = margin.top + ih - sc.ci_hi * ih;
    const scCiBtm = margin.top + ih - sc.ci_lo * ih;
    svg.appendChild(svgEl('line', { x1: cx + barW * 0.425, x2: cx + barW * 0.425,
      y1: scCiTop, y2: scCiBtm, stroke: 'rgba(255,255,255,0.5)', 'stroke-width': 1.5 }));

    // X label
    const shortLabel = m === 'MiniMax-M2.5' ? 'MiniMax' :
                       m === 'glm-4.7' ? 'GLM-4.7' :
                       m === 'random_walk' ? 'Rand.Walk' : 'A*';
    svg.appendChild(svgText(shortLabel, {
      x: cx - barW * 0.15, y: H - margin.bottom + 14,
      'text-anchor': 'middle', fill: col, 'font-size': 10, 'font-weight': 600
    }));
    svg.appendChild(svgText('n='+d.n, {
      x: cx - barW * 0.15, y: H - margin.bottom + 26,
      'text-anchor': 'middle', fill: '#6b7280', 'font-size': 9
    }));
  });

  // Legend
  const legY = H - 8;
  [['■ SR (solid)', 0], ['■ Score (outline)', 160]].forEach(([label, x]) => {
    svg.appendChild(svgText(label, { x: margin.left + x, y: legY,
      fill: '#6b7280', 'font-size': 9 }));
  });

  // Y label
  const yLabel = svgText('Value', { x: 10, y: margin.top + ih/2,
    fill: '#6b7280', 'font-size': 10, 'text-anchor': 'middle',
    transform: `rotate(-90, 10, ${margin.top + ih/2})` });
  svg.appendChild(yLabel);

  card.appendChild(svg);
  return card;
}

/* ── 2. Scatter: SR vs MEI ── */
function buildScatter() {
  const card = makeCard('SR vs MEI — Metacognitive Efficiency', false);
  const W = 460, H = 280;
  const svg = makeSVG(W, H);
  const margin = { top: 20, right: 20, bottom: 48, left: 52 };
  const iw = W - margin.left - margin.right;
  const ih = H - margin.top - margin.bottom;

  // Grid lines
  for (let v = 0; v <= 1.0; v += 0.25) {
    const x = margin.left + v * iw;
    const y = margin.top + ih - v * ih;
    svg.appendChild(svgEl('line', { x1: x, x2: x, y1: margin.top, y2: margin.top + ih,
      stroke: 'rgba(255,255,255,0.04)', 'stroke-width': 1 }));
    svg.appendChild(svgEl('line', { x1: margin.left, x2: margin.left + iw, y1: y, y2: y,
      stroke: 'rgba(255,255,255,0.04)', 'stroke-width': 1 }));
    svg.appendChild(svgText(v.toFixed(1), { x: margin.left + v * iw, y: margin.top + ih + 14,
      'text-anchor': 'middle', fill: '#6b7280', 'font-size': 9 }));
    if (v > 0) svg.appendChild(svgText(v.toFixed(1), { x: margin.left - 6, y: margin.top + ih - v*ih + 4,
      'text-anchor': 'end', fill: '#6b7280', 'font-size': 9 }));
  }

  svg.appendChild(svgText('MEI', { x: margin.left + iw/2, y: H - 6,
    'text-anchor': 'middle', fill: '#6b7280', 'font-size': 10 }));
  const yl = svgText('SR', { x: 12, y: margin.top + ih/2,
    'text-anchor': 'middle', fill: '#6b7280', 'font-size': 10,
    transform: `rotate(-90, 12, ${margin.top + ih/2})` });
  svg.appendChild(yl);

  // Perfect diagonal reference line
  svg.appendChild(svgEl('line', { x1: margin.left, y1: margin.top + ih,
    x2: margin.left + iw, y2: margin.top, stroke: 'rgba(255,255,255,0.08)',
    'stroke-width': 1, 'stroke-dasharray': '4 4' }));

  const models = MODEL_ORDER.filter(m => DATA[m]);
  models.forEach(m => {
    const d = DATA[m];
    const sr = d.metrics.sr.mean;
    const mei = d.metrics.mei.mean;
    const sr_lo = d.metrics.sr.ci_lo, sr_hi = d.metrics.sr.ci_hi;
    const mei_lo = d.metrics.mei.ci_lo, mei_hi = d.metrics.mei.ci_hi;
    const col = COLORS[m];

    const cx = margin.left + mei * iw;
    const cy = margin.top + ih - sr * ih;

    // CI crosses
    svg.appendChild(svgEl('line', { x1: margin.left + mei_lo * iw, x2: margin.left + mei_hi * iw,
      y1: cy, y2: cy, stroke: col, opacity: 0.35, 'stroke-width': 1.5 }));
    svg.appendChild(svgEl('line', { x1: cx, x2: cx,
      y1: margin.top + ih - sr_hi * ih, y2: margin.top + ih - sr_lo * ih,
      stroke: col, opacity: 0.35, 'stroke-width': 1.5 }));

    // Point
    svg.appendChild(svgEl('circle', { cx, cy, r: 7, fill: col, opacity: 0.9 }));

    // Label
    const shortLabel = m === 'MiniMax-M2.5' ? 'MiniMax' :
                       m === 'glm-4.7' ? 'GLM-4.7' :
                       m === 'random_walk' ? 'RandWalk' : 'A*';
    const labelX = cx + (m === 'glm-4.7' ? 10 : m === 'random_walk' ? 10 : 10);
    const labelY = cy + (m === 'MiniMax-M2.5' ? -10 : 4);
    svg.appendChild(svgText(shortLabel, { x: labelX, y: labelY,
      fill: col, 'font-size': 10, 'font-weight': 600 }));
  });

  card.appendChild(svg);
  return card;
}

/* ── 3. Heatmap: metric comparison ── */
function buildHeatmap() {
  const card = makeCard('Multi-Metric Comparison (normalized 0-1)', true);
  const metrics = ['sr', 'mei', 'hrr', 'brs', 'hallumaze_score'];
  const metricLabels = ['SR', 'MEI', 'HRR', 'BRS', 'Score'];

  const W = 900, H = 160;
  const svg = makeSVG(W, H);
  const colW = 140, rowH = 28;
  const leftPad = 140, topPad = 28;

  // Header
  metricLabels.forEach((ml, j) => {
    svg.appendChild(svgText(ml, { x: leftPad + j * colW + colW/2, y: 16,
      'text-anchor': 'middle', fill: '#8892a4', 'font-size': 11, 'font-weight': 600 }));
  });

  MODEL_ORDER.filter(m => DATA[m]).forEach((m, i) => {
    const d = DATA[m];
    const y = topPad + i * rowH;
    const col = COLORS[m];

    // Row label
    const label = m === 'random_walk' ? 'Random Walk' :
                  m === 'astar' ? 'A* Oracle' : LABELS[m] || m;
    svg.appendChild(svgText(label, { x: leftPad - 10, y: y + rowH * 0.65,
      'text-anchor': 'end', fill: col, 'font-size': 11, 'font-weight': 600 }));

    // Category tag
    const tag = d.category === 'LLM' ? 'LLM' : 'Baseline';
    svg.appendChild(svgText(tag, { x: 10, y: y + rowH * 0.65,
      fill: d.category === 'LLM' ? '#6eb3f7' : '#7bf7b5', 'font-size': 9, 'font-weight': 600 }));

    metrics.forEach((metric, j) => {
      const val = d.metrics[metric]?.mean ?? 0;
      const x = leftPad + j * colW;

      // Cell background (opacity = val)
      svg.appendChild(svgEl('rect', { x: x + 4, y: y + 2, width: colW - 8, height: rowH - 4,
        rx: 4, fill: col, opacity: Math.max(0.08, val * 0.7) }));

      // Value text
      const valStr = val >= 0.995 ? '1.000' : val.toFixed(3);
      svg.appendChild(svgText(valStr, { x: x + colW/2, y: y + rowH * 0.67,
        'text-anchor': 'middle', fill: val > 0.5 ? col : '#6b7280', 'font-size': 11,
        'font-weight': val >= 0.8 ? 700 : 400 }));

      // CI range
      const lo = d.metrics[metric]?.ci_lo ?? val;
      const hi = d.metrics[metric]?.ci_hi ?? val;
      if (hi - lo > 0.001) {
        const ciStr = `[${lo.toFixed(2)}-${hi.toFixed(2)}]`;
        svg.appendChild(svgText(ciStr, { x: x + colW/2, y: y + rowH * 0.95,
          'text-anchor': 'middle', fill: 'rgba(255,255,255,0.3)', 'font-size': 8 }));
      }
    });
  });

  card.appendChild(svg);
  return card;
}

/* ── 4. Key statistics ── */
function buildStats() {
  const card = makeCard('Key Statistics');

  const statGrid = document.createElement('div');
  statGrid.className = 'stat-grid';

  const stats = [
    { val: '2', label: 'LLM Models', col: '#6eb3f7' },
    { val: '60', label: 'GLM-4.7 Trials', col: '#f77b6e' },
    { val: '3', label: 'Baselines', col: '#7bf7b5' },
    { val: '100%', label: 'p-bonf sig.', col: '#f7dc7b' },
  ];

  stats.forEach(({ val, label, col }) => {
    const box = document.createElement('div');
    box.className = 'stat-box';

    const valEl = document.createElement('div');
    valEl.className = 'val';
    valEl.style.color = col;
    valEl.textContent = val;

    const labelEl = document.createElement('div');
    labelEl.className = 'label';
    labelEl.textContent = label;

    box.appendChild(valEl);
    box.appendChild(labelEl);
    statGrid.appendChild(box);
  });

  card.appendChild(statGrid);

  const finding = document.createElement('div');
  finding.className = 'finding';
  finding.innerHTML =
    '<strong>Key Finding:</strong> Both LLMs score significantly below all baseline algorithms ' +
    '(p&lt;0.001, Bonferroni-corrected). GLM-4.7 achieves <strong>SR=8.3%</strong> on 5×5 and ' +
    '<strong>SR=0%</strong> on 7×7, losing to a random walk with sufficient budget. ' +
    'MiniMax-M2.5 achieves SR=87.5% but receives a calibration penalty (CE=1.0) for ' +
    'overconfident navigation, bringing its composite score to <strong>0.639</strong> vs. ' +
    'baseline <strong>0.800</strong>.';
  card.appendChild(finding);

  return card;
}

/* ── 5. Stats table ── */
function buildTestTable() {
  const card = makeCard('Statistical Tests (Wilcoxon Rank-Sum, Bonferroni Correction)', false);

  const tests = [
    { a: 'Random Walk', b: 'MiniMax-M2.5', u: '0.0', p_raw: '<0.001', p_bonf: '0.001', d: '-3.44', sig: '***' },
    { a: 'Random Walk', b: 'GLM-4.7',      u: '0.0', p_raw: '<0.001', p_bonf: '<0.001', d: '-1.95', sig: '***' },
    { a: 'MiniMax-M2.5', b: 'GLM-4.7',    u: '66.0', p_raw: '0.003',  p_bonf: '0.010',  d: '0.88',  sig: '**' },
  ];

  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const hrow = document.createElement('tr');
  ['A', 'B', 'U', 'p (raw)', 'p (Bonf.)', "Cohen's d", 'Sig.'].forEach(h => {
    const th = document.createElement('th');
    th.textContent = h;
    hrow.appendChild(th);
  });
  thead.appendChild(hrow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  tests.forEach(t => {
    const row = document.createElement('tr');
    [t.a, t.b, t.u, t.p_raw, t.p_bonf, t.d, t.sig].forEach((v, i) => {
      const td = document.createElement('td');
      td.textContent = v;
      if (i === 0 || i === 1) {
        const modelKey = v === 'Random Walk' ? 'random_walk' :
                         v === 'MiniMax-M2.5' ? 'MiniMax-M2.5' :
                         v === 'GLM-4.7' ? 'glm-4.7' : v;
        td.style.color = COLORS[modelKey] || '#e8eaf0';
        td.style.fontWeight = '600';
      }
      if (i === 6) td.style.color = '#f7dc7b';
      row.appendChild(td);
    });
    tbody.appendChild(row);
  });
  table.appendChild(tbody);

  const note = document.createElement('p');
  note.style.cssText = 'font-size:11px;color:#6b7280;margin-top:12px;';
  note.textContent = '*** p<0.001  ** p<0.01  * p<0.05  (Bonferroni-corrected, k=3 tests)';
  card.appendChild(table);
  card.appendChild(note);
  return card;
}

/* ── 6. Size breakdown ── */
function buildSizeChart() {
  const card = makeCard('SR by Maze Size', false);
  const W = 460, H = 200;
  const svg = makeSVG(W, H);
  const margin = { top: 16, right: 16, bottom: 48, left: 44 };
  const iw = W - margin.left - margin.right;
  const ih = H - margin.top - margin.bottom;

  for (let v = 0; v <= 1.0; v += 0.5) {
    const y = margin.top + ih - v * ih;
    svg.appendChild(svgEl('line', { x1: margin.left, x2: W - margin.right, y1: y, y2: y,
      stroke: 'rgba(255,255,255,0.06)', 'stroke-width': 1 }));
    svg.appendChild(svgText(v.toFixed(1), { x: margin.left - 6, y: y + 4,
      'text-anchor': 'end', fill: '#6b7280', 'font-size': 10 }));
  }

  const sizes = [5, 7];
  const models = MODEL_ORDER.filter(m => DATA[m]);
  const groupW = iw / (sizes.length * (models.length + 1));

  sizes.forEach((sz, si) => {
    const szX = margin.left + si * iw / sizes.length + groupW * 0.5;

    models.forEach((m, mi) => {
      const d = DATA[m];
      const key = `sr_size${sz}`;
      const sr = d.metrics[key]?.mean ?? d.metrics.sr.mean;
      const srH = sr * ih;
      const x = szX + mi * groupW;
      const col = COLORS[m];
      svg.appendChild(svgEl('rect', { x: x, y: margin.top + ih - srH, width: groupW * 0.8, height: srH,
        fill: col, opacity: 0.85, rx: 2 }));
    });

    svg.appendChild(svgText(`${sz}×${sz}`, { x: szX + models.length * groupW / 2, y: H - margin.bottom + 20,
      'text-anchor': 'middle', fill: '#8892a4', 'font-size': 11, 'font-weight': 600 }));
  });

  // Legend
  models.forEach((m, i) => {
    const shortLabel = m === 'MiniMax-M2.5' ? 'MiniMax' :
                       m === 'glm-4.7' ? 'GLM-4.7' :
                       m === 'random_walk' ? 'RandWalk' : 'A*';
    const lx = margin.left + i * 80;
    svg.appendChild(svgEl('rect', { x: lx, y: H - 14, width: 10, height: 10, fill: COLORS[m], rx: 2 }));
    svg.appendChild(svgText(shortLabel, { x: lx + 14, y: H - 6, fill: '#8892a4', 'font-size': 9 }));
  });

  card.appendChild(svg);
  return card;
}

/* ── Build layout ── */
grid.appendChild(buildBarChart());
grid.appendChild(buildScatter());
grid.appendChild(buildStats());
grid.appendChild(buildTestTable());
grid.appendChild(buildSizeChart());
grid.appendChild(buildHeatmap());
</script>
