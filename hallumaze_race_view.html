<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HalluMaze Race View</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100vh;overflow:hidden;background:#0f1117;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;}
#app{display:flex;flex-direction:column;height:100vh;padding:6px 10px;}
#header{text-align:center;padding:4px 0;flex-shrink:0;}
#header h1{font-size:16px;font-weight:600;color:#c8ccd4;letter-spacing:0.5px;}
#header .meta{font-size:11px;color:#6b7280;margin-top:2px;}
#main{display:flex;flex:1;gap:8px;min-height:0;}
#maze-panel{flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
#maze-canvas{background:#12151e;border:1px solid #2a2d3a;border-radius:6px;}
#ecg-panel{flex:1;display:flex;flex-direction:column;min-width:0;}
#ecg-canvas{width:100%;flex:1;background:#12151e;border:1px solid #2a2d3a;border-radius:6px;}
#controls-bar{display:flex;align-items:center;justify-content:center;gap:12px;padding:5px 0;flex-shrink:0;flex-wrap:wrap;}
.legend-item{display:inline-flex;align-items:center;gap:4px;cursor:pointer;padding:2px 6px;border-radius:4px;user-select:none;font-size:12px;}
.legend-item:hover{background:#1e2130;}
.legend-item.off{opacity:0.35;}
.legend-item.focused{background:#1e2130;outline:1px solid #4a4d5a;}
.legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
.legend-cb{width:12px;height:12px;accent-color:#6b7280;}
.btn{background:#1e2130;color:#c8ccd4;border:1px solid #2a2d3a;border-radius:4px;padding:3px 10px;cursor:pointer;font-size:12px;}
.btn:hover{background:#2a2d3a;}
.btn.active{background:#3b3e50;border-color:#5a5d6a;}
#speed-label{font-size:11px;color:#6b7280;}
#speed-slider{width:70px;}
#timeline-bar{flex-shrink:0;padding:4px 0;}
#density-container{position:relative;height:24px;margin-bottom:2px;border-radius:3px;overflow:hidden;background:#161926;}
#density-canvas{width:100%;height:100%;display:block;}
#timeline-row{display:flex;align-items:center;gap:8px;}
#master-slider{flex:1;accent-color:#6b7280;}
#step-label{font-size:12px;color:#8b8fa0;white-space:nowrap;min-width:80px;text-align:right;}
.ecg-no-data{color:#4a4d5a;font-size:11px;text-align:center;}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>HalluMaze Race View</h1>
    <div class="meta" id="meta-info"></div>
  </div>
  <div id="main">
    <div id="maze-panel">
      <canvas id="maze-canvas"></canvas>
    </div>
    <div id="ecg-panel">
      <canvas id="ecg-canvas"></canvas>
    </div>
  </div>
  <div id="controls-bar">
    <div id="legend"></div>
    <button class="btn" id="btn-play">Play</button>
    <button class="btn" id="btn-pause">Pause</button>
    <button class="btn" id="btn-reset">Reset</button>
    <span id="speed-label">Speed:</span>
    <input type="range" id="speed-slider" min="1" max="20" value="5">
  </div>
  <div id="timeline-bar">
    <canvas id="density-canvas" height="24"></canvas>
    <div id="timeline-row">
      <input type="range" id="master-slider" min="0" max="100" value="0">
      <span id="step-label">Step: 0 / 0</span>
    </div>
  </div>
</div>

    cb.addEventListener("change", function(e){
      models[idx].enabled = cb.checked;

      if (!wasFocused) {
        models[idx].focused = true;
        item.classList.add("focused");
      }
      render();
    });

    item.appendChild(cb);
    item.appendChild(dot);
    item.appendChild(label);
    legendEl.appendChild(item);
  })(i);
}

// --- Controls ---
document.getElementById("btn-play").addEventListener("click", function(){ playing = true; });
document.getElementById("btn-pause").addEventListener("click", function(){ playing = false; });
document.getElementById("btn-reset").addEventListener("click", function(){
  playing = false;
  currentStep = 0;
  masterSlider.value = 0;
  render();
});
var speedSlider = document.getElementById("speed-slider");
speedSlider.addEventListener("input", function(){ speed = parseInt(speedSlider.value); });
masterSlider.addEventListener("input", function(){
  currentStep = parseInt(masterSlider.value);
  render();
});

// --- Helpers ---
function confToHue(conf) {
  // conf 0..100 => hue 0(red)..210(blue)
  if (conf == null) conf = 50;
  return (conf / 100) * 210;
}

function manhattanDist(r, c) {
  return Math.abs(r - (N-1)) + Math.abs(c - (N-1));
}

var maxDist = (N-1) * 2;

// --- Draw Maze ---
function drawMaze() {
  mctx.clearRect(0, 0, mazeW, mazeH);
  mctx.fillStyle = "#12151e";
  mctx.fillRect(0, 0, mazeW, mazeH);

  // Confidence heat trail
  var heatMap = new Array(N);
  for (var r = 0; r < N; r++) {
    heatMap[r] = new Array(N);
    for (var c = 0; c < N; c++) {
      heatMap[r][c] = {sum: 0, count: 0};
    }
  }
  var anyFocused = false;
  for (var i = 0; i < models.length; i++) {
    if (models[i].focused) { anyFocused = true; break; }
  }
  for (var i = 0; i < models.length; i++) {
    var m = models[i];
    if (!m.enabled) continue;
    if (anyFocused && !m.focused) continue;
    var limit = Math.min(currentStep, m.steps.length);
    for (var s = 0; s < limit; s++) {
      var step = m.steps[s];
      var conf = step.confidence != null ? step.confidence : 50;
      heatMap[step.r][step.c].sum += conf;
      heatMap[step.r][step.c].count += 1;
    }
  }
  mctx.save();
  mctx.globalAlpha = 0.35;
  for (var r = 0; r < N; r++) {
    for (var c = 0; c < N; c++) {
      if (heatMap[r][c].count > 0) {
        var avg = heatMap[r][c].sum / heatMap[r][c].count;
        var hue = confToHue(avg);
        mctx.fillStyle = "hsl(" + hue + ", 80%, 50%)";
        mctx.fillRect(PAD + c * CELL, PAD + r * CELL, CELL, CELL);
      }
    }
  }
  mctx.restore();

  // Walls
  mctx.strokeStyle = "#5a5d6a";
  mctx.lineWidth = 2;
  for (var r = 0; r < N; r++) {
    for (var c = 0; c < N; c++) {
      var x = PAD + c * CELL;
      var y = PAD + r * CELL;
      var w = walls[r][c];
      if (w.N) { mctx.beginPath(); mctx.moveTo(x, y); mctx.lineTo(x + CELL, y); mctx.stroke(); }
      if (w.S) { mctx.beginPath(); mctx.moveTo(x, y + CELL); mctx.lineTo(x + CELL, y + CELL); mctx.stroke(); }
      if (w.W) { mctx.beginPath(); mctx.moveTo(x, y); mctx.lineTo(x, y + CELL); mctx.stroke(); }
      if (w.E) { mctx.beginPath(); mctx.moveTo(x + CELL, y); mctx.lineTo(x + CELL, y + CELL); mctx.stroke(); }
    }
  }

  // Start and End markers
  var sr = CELL * 0.25;
  mctx.fillStyle = "#22c55e";
  mctx.beginPath();
  mctx.arc(PAD + startC * CELL + CELL/2, PAD + startR * CELL + CELL/2, sr, 0, Math.PI*2);
  mctx.fill();
  mctx.fillStyle = "#ef4444";
  mctx.beginPath();
  mctx.arc(PAD + endC * CELL + CELL/2, PAD + endR * CELL + CELL/2, sr, 0, Math.PI*2);
  mctx.fill();

  // Path trails
  for (var i = 0; i < models.length; i++) {
    var m = models[i];
    if (!m.enabled) continue;
    var limit = Math.min(currentStep, m.steps.length);
    if (limit < 2) continue;
    mctx.save();
    if (anyFocused && !m.focused) mctx.globalAlpha = 0.2;
    mctx.strokeStyle = m.color;
    mctx.lineWidth = 1.5;
    mctx.beginPath();
    mctx.moveTo(PAD + m.steps[0].c * CELL + CELL/2, PAD + m.steps[0].r * CELL + CELL/2);
    for (var s = 1; s < limit; s++) {
      mctx.lineTo(PAD + m.steps[s].c * CELL + CELL/2, PAD + m.steps[s].r * CELL + CELL/2);
    }
    mctx.stroke();
    mctx.restore();
  }

  // Model markers (current position)
  var markerR = CELL * 0.35;
  for (var i = 0; i < models.length; i++) {
    var m = models[i];
    if (!m.enabled) continue;
    var si = Math.min(currentStep, m.steps.length) - 1;
    if (si < 0) continue;
    var step = m.steps[si];
    mctx.save();
    var r_size = markerR;
    if (anyFocused) {
      if (m.focused) {
        r_size = markerR * 1.6;
      } else {
        mctx.globalAlpha = 0.4;
      }
    }
    mctx.fillStyle = m.color;
    mctx.beginPath();
    mctx.arc(PAD + step.c * CELL + CELL/2, PAD + step.r * CELL + CELL/2, r_size, 0, Math.PI*2);
    mctx.fill();
    // White border
    mctx.strokeStyle = "#ffffff";
    mctx.lineWidth = 1;
    mctx.stroke();
    mctx.restore();
  }
}

// --- Draw ECG ---
function drawECG() {
  var rect = ecgCanvas.getBoundingClientRect();
  var w = Math.floor(rect.width);
  var h = Math.floor(rect.height);
  if (ecgCanvas.width !== w || ecgCanvas.height !== h) {
    ecgCanvas.width = w;
    ecgCanvas.height = h;
  }
  ectx.clearRect(0, 0, w, h);

  var stripH = h / models.length;
  var leftMargin = 100;
  var rightMargin = 10;
  var topPad = 14;
  var bottomPad = 4;
  var chartW = w - leftMargin - rightMargin;
  var anyFocused = false;
  for (var i = 0; i < models.length; i++) {
    if (models[i].focused) { anyFocused = true; break; }
  }

  for (var i = 0; i < models.length; i++) {
    var m = models[i];
    var y0 = i * stripH;

    // Background
    ectx.fillStyle = "#161926";
    ectx.fillRect(0, y0, w, stripH);
    // Separator
    if (i > 0) {
      ectx.strokeStyle = "#2a2d3a";
      ectx.lineWidth = 1;
      ectx.beginPath();
      ectx.moveTo(0, y0);
      ectx.lineTo(w, y0);
      ectx.stroke();
    }

    // Label
    ectx.save();
    if (anyFocused && !m.focused) ectx.globalAlpha = 0.3;
    ectx.fillStyle = m.color;
    ectx.font = "bold 11px 'Segoe UI', system-ui, sans-serif";
    ectx.textBaseline = "top";
    ectx.fillText(m.name, 6, y0 + 4);
    // Stats
    ectx.fillStyle = "#6b7280";
    ectx.font = "10px 'Segoe UI', system-ui, sans-serif";
    var statsText = m.steps.length + " steps";
    if (m.solved) statsText += " [SOLVED]";
    if (m.steps.length === 0) statsText = "No step data";
    ectx.fillText(statsText, 6, y0 + 18);
    ectx.restore();

    if (m.steps.length === 0) continue;
    if (!m.enabled) continue;

    // Chart area
    var chartY0 = y0 + topPad;
    var chartH = stripH - topPad - bottomPad;

    ectx.save();
    if (anyFocused && !m.focused) ectx.globalAlpha = 0.2;

    // Grid lines (horizontal)
    ectx.strokeStyle = "#1e2130";
    ectx.lineWidth = 0.5;
    for (var g = 0; g <= 4; g++) {
      var gy = chartY0 + (g / 4) * chartH;
      ectx.beginPath();
      ectx.moveTo(leftMargin, gy);
      ectx.lineTo(leftMargin + chartW, gy);
      ectx.stroke();
    }

    // Distance line
    ectx.strokeStyle = m.color;
    ectx.lineWidth = 1.5;
    ectx.beginPath();
    for (var s = 0; s < m.steps.length; s++) {
      var step = m.steps[s];
      var dist = manhattanDist(step.r, step.c);
      var px = leftMargin + (s / maxSteps) * chartW;
      var py = chartY0 + (dist / maxDist) * chartH; // top=far, bottom=close
      if (s === 0) ectx.moveTo(px, py);
      else ectx.lineTo(px, py);
    }
    ectx.stroke();

    // Event markers
    for (var s = 0; s < m.steps.length; s++) {
      var step = m.steps[s];
      var px = leftMargin + (s / maxSteps) * chartW;
      var dist = manhattanDist(step.r, step.c);
      var py = chartY0 + (dist / maxDist) * chartH;

      if (step.is_hallucination) {
        // Red triangle
        ectx.fillStyle = "#ef4444";
        ectx.beginPath();
        ectx.moveTo(px, py - 6);
        ectx.lineTo(px - 4, py + 2);
        ectx.lineTo(px + 4, py + 2);
        ectx.closePath();
        ectx.fill();
      }
      if (step.is_backtrack) {
        ectx.fillStyle = "#fb923c";
        ectx.fillRect(px - 3, py - 3, 6, 6);
      }
      if (step.is_loop) {
        ectx.fillStyle = "#facc15";
        ectx.beginPath();
        ectx.arc(px, py, 3, 0, Math.PI * 2);
        ectx.fill();
      }
    }

    // Solved star
    if (m.solved && m.steps.length > 0) {
      var lastStep = m.steps[m.steps.length - 1];
      var lx = leftMargin + ((m.steps.length - 1) / maxSteps) * chartW;
      var ld = manhattanDist(lastStep.r, lastStep.c);
      var ly = chartY0 + (ld / maxDist) * chartH;
      drawStar(ectx, lx, ly, 5, 8, 4, "#22c55e");
    }

    ectx.restore();

    // Current step line (always visible)
    var curX = leftMargin + (currentStep / maxSteps) * chartW;
    ectx.save();
    ectx.strokeStyle = "rgba(255,255,255,0.6)";
    ectx.lineWidth = 1;
    ectx.setLineDash([3, 3]);
    ectx.beginPath();
    ectx.moveTo(curX, y0 + topPad);
    ectx.lineTo(curX, y0 + stripH - bottomPad);
    ectx.stroke();
    ectx.setLineDash([]);
    ectx.restore();
  }
}

function drawStar(ctx, cx, cy, spikes, outerR, innerR, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  var rot = -Math.PI / 2;
  for (var i = 0; i < spikes * 2; i++) {
    var r = (i % 2 === 0) ? outerR : innerR;
    var angle = rot + (i * Math.PI / spikes);
    var x = cx + Math.cos(angle) * r;
    var y = cy + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// --- Density bar ---
function drawDensity() {
  var rect = densityCanvas.parentElement.getBoundingClientRect();
  var w = Math.floor(rect.width);
  densityCanvas.width = w;
  densityCanvas.height = 24;
  dctx.clearRect(0, 0, w, 24);

  var barH = Math.floor(24 / models.length);
  for (var i = 0; i < models.length; i++) {
    var m = models[i];
    if (!m.enabled) continue;
    var y = i * barH;
    for (var s = 0; s < m.steps.length; s++) {
      var step = m.steps[s];
      var x = Math.floor((s / maxSteps) * w);
      var color;
      if (step.is_hallucination) color = "#ef4444";
      else if (step.is_backtrack) color = "#fb923c";
      else if (step.is_loop) color = "#facc15";
      else color = m.color;
      dctx.fillStyle = color;
      dctx.globalAlpha = 0.7;
      dctx.fillRect(x, y, Math.max(1, Math.ceil(w / maxSteps)), barH - 1);
    }
  }
  dctx.globalAlpha = 1.0;

  // Current step indicator
  var curX = Math.floor((currentStep / maxSteps) * w);
  dctx.fillStyle = "rgba(255,255,255,0.8)";
  dctx.fillRect(curX, 0, 2, 24);
}

// --- Render all ---
function render() {
  drawMaze();
  drawECG();
  drawDensity();
  stepLabel.textContent = "Step: " + currentStep + " / " + maxSteps;
  masterSlider.value = currentStep;
}

// --- Animation loop ---
function tick(ts) {
  if (playing) {
    if (ts - lastFrameTime > (1000 / (speed * 3))) {
      lastFrameTime = ts;
      if (currentStep < maxSteps) {
        currentStep++;
        render();
      } else {
        playing = false;
      }
    }
  }
  requestAnimationFrame(tick);
}

// --- Resize handler ---
function onResize() {
  render();
}
window.addEventListener("resize", onResize);

// --- Init ---
render();
requestAnimationFrame(tick);

})();
</script>
</body>
