<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HalluMaze — Multi-Model Race Viewer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#e8e8f0;font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh}
h1{text-align:center;padding:18px 0 4px;font-size:1.3rem;letter-spacing:2px;color:#9b8fff;text-transform:uppercase}
.subtitle{text-align:center;font-size:.75rem;color:#666;margin-bottom:16px}

/* Seed selector */
.seed-tabs{display:flex;justify-content:center;gap:8px;margin-bottom:20px}
.seed-tab{padding:6px 18px;border-radius:20px;border:1px solid #333;background:#111;color:#888;cursor:pointer;font-size:.8rem;transition:all .2s}
.seed-tab.active{background:#9b8fff;color:#fff;border-color:#9b8fff}

/* Main layout */
.race-layout{display:flex;gap:16px;padding:0 16px 16px;max-width:1200px;margin:0 auto;flex-wrap:wrap;justify-content:center}

/* Maze canvas area */
.maze-panel{flex:0 0 auto;display:flex;flex-direction:column;align-items:center}
canvas{border-radius:8px;display:block}
.maze-label{margin-top:6px;font-size:.7rem;color:#555;text-align:center}

/* Model cards */
.model-grid{display:flex;flex-direction:column;gap:8px;flex:1;min-width:220px;max-width:340px}
.model-card{background:#111;border:1px solid #222;border-radius:8px;padding:10px 12px;transition:border-color .3s}
.model-card.active-step{border-color:var(--c)}
.model-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.model-dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex-shrink:0}
.model-name{font-size:.78rem;font-weight:600;color:#ccc;flex:1}
.model-badge{font-size:.65rem;padding:2px 7px;border-radius:10px;background:#1a1a2e}
.solved{background:#1a3a1a;color:#4ade80}
.failed{background:#2a1a1a;color:#f87171}

.metric-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}
.metric{font-size:.65rem;padding:2px 6px;border-radius:4px;background:#1a1a1a;color:#aaa}
.metric span{color:#e8e8f0;font-weight:600}

.progress-bar-bg{height:4px;background:#1c1c2e;border-radius:2px;margin-top:4px}
.progress-bar{height:4px;border-radius:2px;background:var(--c);transition:width .3s;max-width:100%}

.pos-display{font-size:.68rem;color:#666;margin-top:3px}

/* Timeline controls */
.controls{display:flex;align-items:center;gap:12px;justify-content:center;padding:12px;background:#0d0d16;border-top:1px solid #1a1a2e;flex-wrap:wrap}
.btn{padding:6px 14px;border-radius:6px;border:none;cursor:pointer;font-size:.78rem;font-weight:600;transition:all .15s}
.btn-play{background:#9b8fff;color:#fff}
.btn-play:hover{background:#b0a0ff}
.btn-step{background:#1c1c2e;color:#9b8fff;border:1px solid #9b8fff}
.btn-reset{background:#1c1c2e;color:#aaa;border:1px solid #333}
.btn-reset:hover{color:#f87171;border-color:#f87171}
input[type=range]{width:200px;accent-color:#9b8fff}
.step-counter{font-size:.78rem;color:#666;min-width:70px;text-align:center}
.speed-select{background:#1c1c2e;color:#aaa;border:1px solid #333;border-radius:4px;padding:4px 8px;font-size:.75rem}

/* Legend */
.legend{display:flex;gap:12px;justify-content:center;padding:8px;font-size:.68rem;color:#666;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:4px}
.leg-dot{width:8px;height:8px;border-radius:50%}

/* Stats bar */
.stats-bar{display:flex;gap:20px;justify-content:center;padding:8px 16px;background:#0d0d16;border-bottom:1px solid #1a1a2e;font-size:.72rem;flex-wrap:wrap}
.stat-item{color:#666}
.stat-item span{color:#9b8fff;font-weight:600}
</style>
</head>
<body>
<h1>HalluMaze — Model Navigation Race</h1>
<p class="subtitle">Same maze · All models · Step-by-step navigation replay</p>

<div class="seed-tabs" id="seedTabs"></div>

<div class="stats-bar" id="statsBar">
  <div class="stat-item">Maze: <span id="mazeSizeLabel">5×5</span></div>
  <div class="stat-item">Seed: <span id="seedLabel">—</span></div>
  <div class="stat-item">Step: <span id="globalStep">0</span> / <span id="maxStepLabel">0</span></div>
  <div class="stat-item">Models active: <span id="activeModels">5</span></div>
</div>

<div class="race-layout">
  <div class="maze-panel">
    <canvas id="mazeCanvas" width="360" height="360"></canvas>
    <div class="maze-label">All model positions overlaid · 🔴 Hallucination · 🟠 Backtrack</div>
  </div>
  <div class="model-grid" id="modelGrid"></div>
</div>

<div class="legend">
  <div class="leg"><div class="leg-dot" style="background:#f59e0b"></div> MiniMax-M2.5</div>
  <div class="leg"><div class="leg-dot" style="background:#22d3ee"></div> GLM-4.5-flash</div>
  <div class="leg"><div class="leg-dot" style="background:#a78bfa"></div> GLM-4.5</div>
  <div class="leg"><div class="leg-dot" style="background:#4ade80"></div> GLM-4.6</div>
  <div class="leg"><div class="leg-dot" style="background:#fb7185"></div> GLM-4.7</div>
  <div class="leg"><div class="leg-dot" style="background:#ef4444;border:1px solid #fff"></div> Hallucination</div>
  <div class="leg"><div class="leg-dot" style="background:#f97316;border:1px solid #fff"></div> Backtrack</div>
</div>

<div class="controls">
  <button class="btn btn-reset" id="btnReset">⏮ Reset</button>
  <button class="btn btn-step" id="btnPrev">◀ Step</button>
  <button class="btn btn-play" id="btnPlay">▶ Play</button>
  <button class="btn btn-step" id="btnNext">▶ Step</button>
  <input type="range" id="timeline" min="0" max="0" value="0">
  <div class="step-counter">Step <span id="sliderStep">0</span></div>
  <select class="speed-select" id="speedSelect">
    <option value="800">0.5×</option>
    <option value="400" selected>1×</option>
    <option value="200">2×</option>
    <option value="100">4×</option>
    <option value="50">8×</option>
  </select>
</div>

    const color = MODEL_COLORS[r.model] || "#888";
    const card = document.createElement("div");
    card.className = "model-card";
    card.id = "card-" + r.model.replace(/[^a-z0-9]/gi, "_");
    card.style.setProperty("--c", color);
    const maxSteps = r.steps.length;
    card.innerHTML = `
      <div class="model-header">
        <div class="model-dot"></div>
        <div class="model-name">${r.model}</div>
        <div class="model-badge ${r.solved ? "solved" : "failed"}">${r.solved ? "✓ SOLVED" : "✗ FAILED"}</div>
      </div>
      <div class="metric-row">
        <div class="metric">Score <span>${r.score}</span></div>
        <div class="metric">MEI <span>${r.mei}</span></div>
        <div class="metric">Hall <span id="hall-${r.model.replace(/[^a-z0-9]/gi,'_')}">${r.hallucination_count}</span></div>
        <div class="metric">BT <span id="bt-${r.model.replace(/[^a-z0-9]/gi,'_')}">${r.backtrack_count}</span></div>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar" id="prog-${r.model.replace(/[^a-z0-9]/gi,'_')}" style="width:0%"></div>
      </div>
      <div class="pos-display" id="pos-${r.model.replace(/[^a-z0-9]/gi,'_')}">Position: (0,0) · Step 0/${maxSteps}</div>
    `;
    grid.appendChild(card);
  });
}

function getCellSize(N) {
  const maxCanvasPx = 360;
  return Math.floor(maxCanvasPx / N);
}

function drawMaze(walls, N) {
  const cs = getCellSize(N);
  const W = cs * N, H = cs * N;
  canvas.width = W; canvas.height = H;
  
  ctx.fillStyle = "#0f0f1a";
  ctx.fillRect(0, 0, W, H);

  // Draw grid cells (background)
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const x = c * cs, y = r * cs;
      // Cell interior
      ctx.fillStyle = "#141420";
      ctx.fillRect(x+1, y+1, cs-2, cs-2);
    }
  }

  // Start / End markers
  ctx.fillStyle = "rgba(74, 222, 128, 0.15)";
  ctx.fillRect(1, 1, cs-2, cs-2);
  ctx.fillStyle = "rgba(251, 113, 133, 0.15)";
  ctx.fillRect((N-1)*cs+1, (N-1)*cs+1, cs-2, cs-2);

  // Draw walls
  ctx.strokeStyle = "#6060a0";
  ctx.lineWidth = 2;
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const cell = walls[r][c];
      const x = c * cs, y = r * cs;
      ctx.beginPath();
      if (cell.N) { ctx.moveTo(x, y); ctx.lineTo(x+cs, y); }
      if (cell.S) { ctx.moveTo(x, y+cs); ctx.lineTo(x+cs, y+cs); }
      if (cell.W) { ctx.moveTo(x, y); ctx.lineTo(x, y+cs); }
      if (cell.E) { ctx.moveTo(x+cs, y); ctx.lineTo(x+cs, y+cs); }
      ctx.stroke();
    }
  }

  // S/E labels
  ctx.fillStyle = "#4ade80"; ctx.font = "bold " + Math.max(8, cs/4) + "px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("S", cs/2, cs/2);
  ctx.fillStyle = "#fb7185";
  ctx.fillText("G", (N-0.5)*cs, (N-0.5)*cs);
}

function drawAgents(results, N, step) {
  const cs = getCellSize(N);
  const activeCount = results.filter(r => step <= r.steps.length).length;
  document.getElementById("activeModels").textContent = results.filter(r => step > 0 && step <= r.steps.length).length;

  // Draw trails first
  results.forEach(r => {
    const color = MODEL_COLORS[r.model] || "#888";
    const stepsToShow = r.steps.slice(0, Math.min(step, r.steps.length));
    if (stepsToShow.length < 2) return;

    // Fading trail
    for (let i = 1; i < stepsToShow.length; i++) {
      const prev = stepsToShow[i-1];
      const curr = stepsToShow[i];
      const alpha = 0.1 + 0.3 * (i / stepsToShow.length);
      ctx.strokeStyle = color + Math.floor(alpha * 255).toString(16).padStart(2,'0');
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(prev.c * cs + cs/2, prev.r * cs + cs/2);
      ctx.lineTo(curr.c * cs + cs/2, curr.r * cs + cs/2);
      ctx.stroke();
    }
  });

  // Draw current positions
  const offsets = [[-4,-4],[4,-4],[-4,4],[4,4],[0,0]]; // spread slightly to avoid overlap
  results.forEach((r, idx) => {
    const color = MODEL_COLORS[r.model] || "#888";
    const stepData = step > 0 ? r.steps[Math.min(step, r.steps.length) - 1] : null;
    if (!stepData) return;
    
    const cx = stepData.c * cs + cs/2 + offsets[idx][0];
    const cy = stepData.r * cs + cs/2 + offsets[idx][1];
    const isHall = stepData.is_hallucination;
    const isBT = stepData.is_backtrack;
    
    // Glow
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, cs/2.5);
    grad.addColorStop(0, color + "66");
    grad.addColorStop(1, color + "00");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, cs/2.5, 0, Math.PI*2);
    ctx.fill();

    // Agent dot
    ctx.beginPath();
    ctx.arc(cx, cy, cs/4.5, 0, Math.PI*2);
    if (isHall) {
      ctx.fillStyle = "#ef4444";
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 1.5;
      ctx.fill(); ctx.stroke();
    } else if (isBT) {
      ctx.fillStyle = "#f97316";
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.fill(); ctx.stroke();
    } else {
      ctx.fillStyle = color;
      ctx.fill();
    }

    // Model index label
    ctx.fillStyle = "#fff";
    ctx.font = "bold " + Math.max(7, cs/5) + "px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(idx + 1, cx, cy);
  });
}

function updateModelCards(results, N, step) {
  results.forEach(r => {
    const key = r.model.replace(/[^a-z0-9]/gi, "_");
    const stepsUntilNow = r.steps.slice(0, Math.min(step, r.steps.length));
    const pct = stepsUntilNow.length / Math.max(r.steps.length, 1) * 100;
    const prog = document.getElementById("prog-" + key);
    if (prog) prog.style.width = pct + "%";
    
    const posEl = document.getElementById("pos-" + key);
    if (posEl) {
      if (stepsUntilNow.length > 0) {
        const last = stepsUntilNow[stepsUntilNow.length - 1];
        const isSolved = r.solved && stepsUntilNow.length === r.steps.length;
        const status = isSolved ? " ✓ SOLVED" : (stepsUntilNow.length === r.steps.length ? " (done)" : "");
        posEl.textContent = `Position: (${last.r},${last.c}) · Step ${stepsUntilNow.length}/${r.steps.length}${status}`;
      } else {
        posEl.textContent = `Position: (0,0) · Step 0/${r.steps.length}`;
      }
    }

    // Highlight active step
    const card = document.getElementById("card-" + key);
    if (card) {
      card.classList.toggle("active-step", stepsUntilNow.length < r.steps.length && stepsUntilNow.length > 0);
    }
  });
  
  document.getElementById("globalStep").textContent = step;
  document.getElementById("sliderStep").textContent = step;
  document.getElementById("timeline").value = step;
}

function drawFrame(step) {
  if (!currentSeed) return;
  const d = ALL_DATA[currentSeed];
  drawMaze(d.maze.walls, d.maze.N);
  drawAgents(d.results, d.maze.N, step);
  updateModelCards(d.results, d.maze.N, step);
}

function togglePlay() {
  isPlaying = !isPlaying;
  document.getElementById("btnPlay").textContent = isPlaying ? "⏸ Pause" : "▶ Play";
  if (isPlaying) {
    const speed = parseInt(document.getElementById("speedSelect").value);
    playInterval = setInterval(() => {
      if (currentStep >= maxStep) {
        isPlaying = false;
        document.getElementById("btnPlay").textContent = "▶ Play";
        clearInterval(playInterval);
        return;
      }
      currentStep++;
      drawFrame(currentStep);
    }, speed);
  } else {
    clearInterval(playInterval);
  }
}

// Event listeners
document.getElementById("btnPlay").onclick = togglePlay;
document.getElementById("btnReset").onclick = () => {
  if (isPlaying) togglePlay();
  currentStep = 0;
  drawFrame(0);
};
document.getElementById("btnPrev").onclick = () => {
  if (currentStep > 0) { currentStep--; drawFrame(currentStep); }
};
document.getElementById("btnNext").onclick = () => {
  if (currentStep < maxStep) { currentStep++; drawFrame(currentStep); }
};
document.getElementById("timeline").oninput = (e) => {
  currentStep = parseInt(e.target.value);
  drawFrame(currentStep);
};
document.getElementById("speedSelect").onchange = () => {
  if (isPlaying) { clearInterval(playInterval); isPlaying = true; togglePlay(); isPlaying = false; togglePlay(); }
};

// Init
initSeedTabs();
loadSeed(parseInt(Object.keys(ALL_DATA)[0]), document.querySelector(".seed-tab"));
</script>
